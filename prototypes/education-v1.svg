<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">教育经历原型：学校 Logo 时间线</title>
  <desc id="desc">以时间线串联学校经历，使用校徽占位展示学校 Logo，并将专业和主要课程分层呈现。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#27364b" flood-opacity=".075"/>
    </filter>
    <linearGradient id="logoWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4effb"/>
      <stop offset="1" stop-color="#ece6f6"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#f8f8f6"/>
  <rect x="0" y="0" width="1920" height="12" fill="#55218b"/>

  <g font-family="Inter, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="144" y="156" fill="#15191f" font-size="58" font-weight="650" letter-spacing="-2">教育经历</text>
    <text x="147" y="207" fill="#818a97" font-size="22" font-weight="400">从专业训练到持续学习，记录知识结构与成长路径。</text>
    <g transform="translate(1530 117)">
      <rect width="245" height="42" rx="21" fill="#f0eaf7"/>
      <circle cx="22" cy="21" r="5" fill="#6c35a0"/>
      <text x="40" y="27" fill="#67438c" font-size="15" font-weight="600" letter-spacing="1">教育时间线 · 原型方案</text>
    </g>

    <!-- chronological rail -->
    <path d="M365 357 V807" fill="none" stroke="#ddd2ea" stroke-width="3" stroke-linecap="round"/>

    <!-- recent education -->
    <g>
      <rect x="145" y="335" width="178" height="46" rx="23" fill="#fff" stroke="#e9e5ed"/>
      <text x="234" y="365" text-anchor="middle" fill="#596273" font-size="17" font-weight="650">2024 — 2025</text>
      <circle cx="365" cy="357" r="11" fill="#fff" stroke="#6c35a0" stroke-width="4"/>

      <rect x="410" y="274" width="1360" height="260" rx="18" fill="#fff" stroke="#e9e5ed" filter="url(#shadow)"/>
      <path d="M428 275 H1752" stroke="#7540a4" stroke-width="3" stroke-linecap="round" opacity=".72"/>

      <!-- official logo placeholder, deliberately not a fabricated school mark -->
      <rect x="450" y="326" width="122" height="122" rx="18" fill="url(#logoWash)" stroke="#e6ddef"/>
      <circle cx="511" cy="378" r="31" fill="#fff" stroke="#cbb7df" stroke-width="2"/>
      <path d="M494 387 V371 L511 359 L528 371 V387 M500 387 V376 H522 V387 M507 387 V379 H515 V387" fill="none" stroke="#71419b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="511" y="428" text-anchor="middle" fill="#877b93" font-size="12" font-weight="600" letter-spacing="1.5">学校 LOGO</text>

      <text x="610" y="342" fill="#828b98" font-size="14" font-weight="650" letter-spacing="1.7">继续学习</text>
      <text x="610" y="386" fill="#171b22" font-size="31" font-weight="700">深圳大学</text>
      <text x="610" y="423" fill="#5e6672" font-size="19" font-weight="500">计算机信息管理 / 学士</text>
      <rect x="1538" y="323" width="188" height="38" rx="19" fill="#f5f1f8"/>
      <text x="1632" y="348" text-anchor="middle" fill="#68428d" font-size="14" font-weight="650">本科 · 继续教育</text>

      <line x1="610" y1="451" x2="1726" y2="451" stroke="#eeeaf1"/>
      <text x="610" y="484" fill="#737d8a" font-size="14" font-weight="650" letter-spacing="1.4">主要课程</text>
      <g font-size="14" font-weight="500" fill="#4f5967">
        <rect x="610" y="498" width="142" height="27" rx="13.5" fill="#f4f2f7"/><text x="681" y="517" text-anchor="middle">数据结构导论</text>
        <rect x="762" y="498" width="154" height="27" rx="13.5" fill="#f4f2f7"/><text x="839" y="517" text-anchor="middle">操作系统概论</text>
        <rect x="926" y="498" width="158" height="27" rx="13.5" fill="#f4f2f7"/><text x="1005" y="517" text-anchor="middle">数据库系统原理</text>
        <rect x="1094" y="498" width="142" height="27" rx="13.5" fill="#f4f2f7"/><text x="1165" y="517" text-anchor="middle">C++ 程序设计</text>
        <rect x="1246" y="498" width="158" height="27" rx="13.5" fill="#f4f2f7"/><text x="1325" y="517" text-anchor="middle">计算机网络原理</text>
        <rect x="1414" y="498" width="166" height="27" rx="13.5" fill="#f4f2f7"/><text x="1497" y="517" text-anchor="middle">信息系统开发与管理</text>
        <text x="1600" y="517" fill="#76509a" font-weight="650">等</text>
      </g>
    </g>

    <!-- earlier education -->
    <g>
      <rect x="145" y="785" width="178" height="46" rx="23" fill="#fff" stroke="#e9e5ed"/>
      <text x="234" y="815" text-anchor="middle" fill="#596273" font-size="17" font-weight="650">2008 — 2011</text>
      <circle cx="365" cy="807" r="11" fill="#fff" stroke="#b77c59" stroke-width="4"/>

      <rect x="410" y="654" width="1360" height="306" rx="18" fill="#fff" stroke="#e9e5ed" filter="url(#shadow)"/>
      <path d="M428 655 H1752" stroke="#b77c59" stroke-width="3" stroke-linecap="round" opacity=".8"/>

      <!-- official logo placeholder, deliberately not a fabricated school mark -->
      <rect x="450" y="716" width="122" height="122" rx="18" fill="#f7f0eb" stroke="#efe2d8"/>
      <circle cx="511" cy="768" r="31" fill="#fff" stroke="#dfc8b8" stroke-width="2"/>
      <path d="M494 777 V761 L511 749 L528 761 V777 M500 777 V766 H522 V777 M507 777 V769 H515 V777" fill="none" stroke="#a76749" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="511" y="818" text-anchor="middle" fill="#8e7e74" font-size="12" font-weight="600" letter-spacing="1.5">学校 LOGO</text>

      <text x="610" y="730" fill="#828b98" font-size="14" font-weight="650" letter-spacing="1.7">专业训练</text>
      <text x="610" y="774" fill="#171b22" font-size="31" font-weight="700">广东机电职业技术学院</text>
      <text x="610" y="811" fill="#5e6672" font-size="19" font-weight="500">信息安全技术</text>
      <rect x="1538" y="711" width="188" height="38" rx="19" fill="#f8f3ef"/>
      <text x="1632" y="736" text-anchor="middle" fill="#9a6147" font-size="14" font-weight="650">专业教育</text>

      <line x1="610" y1="843" x2="1726" y2="843" stroke="#f0ebe7"/>
      <text x="610" y="876" fill="#737d8a" font-size="14" font-weight="650" letter-spacing="1.4">主要课程</text>
      <g font-size="14" font-weight="500" fill="#4f5967">
        <rect x="610" y="892" width="154" height="27" rx="13.5" fill="#f6f3f1"/><text x="687" y="911" text-anchor="middle">数据库应用开发</text>
        <rect x="774" y="892" width="146" height="27" rx="13.5" fill="#f6f3f1"/><text x="847" y="911" text-anchor="middle">网络通信基础</text>
        <rect x="930" y="892" width="142" height="27" rx="13.5" fill="#f6f3f1"/><text x="1001" y="911" text-anchor="middle">C# 程序设计</text>
        <rect x="1082" y="892" width="108" height="27" rx="13.5" fill="#f6f3f1"/><text x="1136" y="911" text-anchor="middle">网页设计</text>
        <rect x="1200" y="892" width="142" height="27" rx="13.5" fill="#f6f3f1"/><text x="1271" y="911" text-anchor="middle">信息安全概论</text>
        <rect x="1352" y="892" width="168" height="27" rx="13.5" fill="#f6f3f1"/><text x="1436" y="911" text-anchor="middle">Linux 服务器配置</text>
        <rect x="1530" y="892" width="154" height="27" rx="13.5" fill="#f6f3f1"/><text x="1607" y="911" text-anchor="middle">网络攻防技术</text>
        <text x="1695" y="911" fill="#9a6147" font-weight="650">等</text>
      </g>
    </g>

    <text x="144" y="1023" fill="#9299a2" font-size="14">校徽使用真实图片素材替换占位；课程较多时可折叠或展示部分标签。</text>
    <text x="1775" y="1023" text-anchor="end" fill="#a4a9b0" font-size="13" letter-spacing="1.2">EDUCATION · PROTOTYPE 01</text>
  </g>
</svg>
